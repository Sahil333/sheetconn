version: '3.8'

services:
  postgres:
    image: postgres:16.1-alpine3.19
    ports:
      - 5432:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=test_user
      - POSTGRES_DB=workbookDb

volumes:
  postgres-data:
    name: postgres-data
